{% extends 'layout.html' %} 
{% block title %} {{ post.title }} {% endblock %}
{% block content %}
<section>
    <h1>{{ post.title }}</h1>
    <p class="meta">{{ post.date }}</p>
    <p class="body">{{ post.body }}</p>
    <p class="author">Автор <strong>{{ post.author.username }}</strong></p>
    <img class="banner" src="{{ post.banner.url }}" alt="{{ post.title }}" />
</section>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        color: #5a3a3a;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    section {
        max-width: 800px;
        width: 90%;
        margin: 20px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    h1 {
        text-align: center;
        color: #ff6f61;
        font-size: 2.5em;
        margin-bottom: 20px;
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(255, 111, 97, 0.2);
    }

    .meta {
        text-align: center;
        color: #888;
        font-size: 0.9em;
        margin-bottom: 30px;
    }

    .body {
        font-size: 1.1em;
        line-height: 1.8;
        color: #5a3a3a;
        margin-bottom: 30px;
    }

    .author {
        text-align: center;
        font-size: 1em;
        color: #ff6f61;
        margin-bottom: 20px;
    }

    .author strong {
        color: #ff3b2f;
    }

    .banner {
        width: 100%;
        border-radius: 15px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .banner:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    /* Анимация для плавного появления */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    section {
        animation: fadeIn 0.6s ease-out;
    }

    /* Дополнительные стили для красоты */
    ::selection {
        background: #ff6f61;
        color: #fff;
    }

    /* Подключение шрифта Poppins */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
</style>
{% endblock %}
