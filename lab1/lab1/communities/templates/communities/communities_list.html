{% extends 'layout.html' %} {% block title %} Communities {% endblock %}
{% block content %}
<section>
    <h1>Communities</h1>

    {% for communitie in communities %}
    <article class="communitie">
        <h2>
            <a href="{%  url 'communities:page' slug=communitie.slug %}"> {{ communitie.name }} </a>
        </h2>
    </article>
    {% endfor %}
</section>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        color: #5a3a3a;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    section {
        max-width: 800px;
        width: 90%;
        margin: 20px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    h1 {
        text-align: center;
        color: #ff6f61;
        font-size: 2.5em;
        margin-bottom: 30px;
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(255, 111, 97, 0.2);
    }

    .communitie {
        margin-bottom: 20px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
    }

    .communitie:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 24px rgba(255, 111, 97, 0.3);
        background: rgba(255, 255, 255, 1);
    }

    .communitie h2 a {
        color: #ff6f61;
        text-decoration: none;
        font-size: 1.5em;
        transition: color 0.3s;
    }

    .communitie h2 a:hover {
        color: #ff3b2f;
    }

    /* Анимация для плавного появления */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    section {
        animation: fadeIn 0.6s ease-out;
    }

    /* Дополнительные стили для красоты */
    ::selection {
        background: #ff6f61;
        color: #fff;
    }

    /* Подключение шрифта Poppins */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
</style>
{% endblock %}
