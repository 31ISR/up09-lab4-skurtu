{% extends 'layout.html' %} {% block title %} {{ communitie.name }} {% endblock %}
{% block content %}
<section>
    <img class="banner" src="{{ communitie.banner.url }}" alt="{{ communitie.name }}" />
    <h1>{{ communitie.name }}</h1>
    <p>{{ communitie.date }}</p>
    <p>{{ communitie.description }}</p>
    <p>Автор <strong>{{ communitie.author.username }} </strong></p>
</section>

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        color: #5a3a3a;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    section {
        max-width: 800px;
        width: 90%;
        padding: 40px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        animation: fadeIn 0.6s ease-out;
    }

    h1 {
        text-align: center;
        color: #ff6f61;
        font-size: 2.5em;
        margin-bottom: 20px;
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(255, 111, 97, 0.2);
    }

    .banner {
        width: 100%;
        border-radius: 15px;
        margin-bottom: 20px;
    }

    p {
        font-size: 1.1em;
        line-height: 1.6;
        margin-bottom: 10px;
    }

    strong {
        color: #ff6f61;
    }

    .author-info {
        display: flex;
        align-items: center;
        margin-top: 20px;
    }

    /* Анимация для плавного появления */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Подключение шрифта Poppins */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
</style>

{% endblock %}
